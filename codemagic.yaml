workflows:
  ios-unsigned:
    name: elTahi iOS Demo (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Check Dart code
        script: flutter analyze
      - name: Test navigation and launch intro
        script: flutter test
      - name: Prepare iOS project
        script: flutter build ios --release --no-codesign --config-only
      - name: Archive without Apple signing credentials
        script: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/elTahi.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
      - name: Package IPA for Sideloadly
        script: |
          set -euo pipefail
          test -d build/elTahi.xcarchive/Products/Applications/Runner.app
          mkdir -p build/sideload/Payload dist
          cp -R build/elTahi.xcarchive/Products/Applications/Runner.app build/sideload/Payload/Runner.app
          (cd build/sideload && zip -qry ../../dist/elTahi-demo-unsigned.ipa Payload)
          unzip -t dist/elTahi-demo-unsigned.ipa
    artifacts:
      - dist/elTahi-demo-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
